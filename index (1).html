<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Built To Trade</title>
<style>
:root{
  --black:#060606;--deep:#0d0d0d;--card:#151515;--card2:#1c1c1c;
  --border:#232323;--border2:#2e2e2e;
  --gold:#c9a84c;--gold-l:#e8c97a;
  --gold-dim:rgba(201,168,76,0.1);--gold-glow:rgba(201,168,76,0.05);
  --cream:#f0e6cc;--white:#ffffff;
  --muted:#555555;--muted2:#888888;
  --text:#c4c0b8;--text2:#e0dcd4;
  --teal:#2dd4bf;--red:#ef4444;--green:#22c55e;
  --blue:#60a5fa;--purple:#a78bfa;--orange:#f97316;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--black);color:var(--text);font-family:Georgia,serif;font-size:15px;line-height:1.8;overflow-x:hidden;}

/* NAV */
#topnav{position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(6,6,6,0.98);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;height:52px;}
#topnav .logo{font-family:sans-serif;font-size:0.9rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);}
#topnav .logo span{color:var(--white);}
.nav-sep{width:1px;height:16px;background:var(--border);margin:0 0.9rem;}
#nav-title{font-family:sans-serif;font-size:0.6rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
#nav-right{margin-left:auto;display:flex;align-items:center;gap:0.75rem;}
#nav-pct{font-family:sans-serif;font-size:0.6rem;color:var(--muted);}
.pbar{width:80px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
.pfill{height:100%;background:var(--gold);width:0%;transition:width 0.5s;}
.nav-home-btn{font-family:sans-serif;font-size:0.6rem;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:0.25rem 0.65rem;border-radius:3px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;}
.nav-home-btn:hover{color:var(--text2);border-color:var(--border2);}

/* LAYOUT */
#app{display:flex;padding-top:52px;min-height:100vh;}

/* SIDEBAR */
#sidebar{width:268px;flex-shrink:0;background:var(--deep);border-right:1px solid var(--border);position:fixed;top:52px;left:0;height:calc(100vh - 52px);overflow-y:auto;}
#sidebar::-webkit-scrollbar{width:2px;}
#sidebar::-webkit-scrollbar-thumb{background:var(--border);}
.sb-brand{padding:0.9rem 1rem 0.75rem;border-bottom:1px solid var(--border);}
.sb-brand-tag{font-family:sans-serif;font-size:0.52rem;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:0.15rem;}
.sb-brand-name{font-family:sans-serif;font-size:0.7rem;color:var(--text2);font-weight:600;}

/* SIDEBAR SECTIONS */
.sb-section{border-bottom:1px solid rgba(255,255,255,0.04);}
.sb-section-btn{width:100%;display:flex;align-items:center;gap:0.5rem;padding:0.7rem 1rem;cursor:pointer;background:none;border:none;text-align:left;transition:background 0.15s;}
.sb-section-btn:hover{background:rgba(255,255,255,0.02);}
.sb-num{width:19px;height:19px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:0.55rem;color:var(--muted);flex-shrink:0;transition:all 0.2s;}
.sb-num.active{background:var(--gold);color:var(--black);}
.sb-num.complete{background:var(--green);color:var(--black);}
.sb-section-title{font-family:sans-serif;font-size:0.65rem;color:var(--text);font-weight:500;flex:1;line-height:1.3;text-align:left;}
.sb-section-title.active{color:var(--gold);}
.sb-arrow{font-size:0.5rem;color:var(--muted);transition:transform 0.2s;flex-shrink:0;}
.sb-arrow.open{transform:rotate(90deg);}

/* LESSON LIST */
.sb-lesson-list{display:none;}
.sb-lesson-list.open{display:block;}
.sb-lesson-btn{width:100%;display:flex;align-items:center;gap:0.4rem;padding:0.4rem 1rem 0.4rem 2.8rem;cursor:pointer;background:none;border:none;border-left:2px solid transparent;text-align:left;font-family:sans-serif;font-size:0.62rem;color:var(--muted);transition:all 0.15s;line-height:1.4;}
.sb-lesson-btn:hover{color:var(--text);background:rgba(255,255,255,0.015);}
.sb-lesson-btn.active{color:var(--gold);border-left-color:var(--gold);background:var(--gold-glow);}
.sb-lesson-btn.complete{color:var(--green);}
.sb-dot{width:4px;height:4px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background 0.2s;}
.sb-lesson-btn.active .sb-dot{background:var(--gold);}
.sb-lesson-btn.complete .sb-dot{background:var(--green);}

/* MAIN CONTENT */
#main{margin-left:268px;flex:1;}
.view{display:none;}

/* HERO AREA */
.hero{background:var(--black);padding:3.5rem;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;top:-30%;right:-5%;width:450px;height:450px;background:radial-gradient(circle,rgba(201,168,76,0.06) 0%,transparent 65%);pointer-events:none;}
.hero-tag{display:inline-flex;align-items:center;background:var(--gold-dim);border:1px solid rgba(201,168,76,0.2);color:var(--gold);font-family:sans-serif;font-size:0.55rem;letter-spacing:2.5px;text-transform:uppercase;padding:0.25rem 0.7rem;border-radius:2px;margin-bottom:1.35rem;}
.hero h1{font-size:2.6rem;font-weight:400;color:var(--white);line-height:1.1;margin-bottom:0.85rem;max-width:600px;}
.hero h1 em{color:var(--gold);font-style:normal;}
.hero-lead{font-size:0.88rem;color:var(--muted2);max-width:540px;line-height:1.9;margin-bottom:1.5rem;}
.hero-quote{border-left:2px solid var(--gold);padding-left:1rem;max-width:520px;font-size:0.85rem;color:var(--cream);font-style:italic;line-height:1.9;margin-bottom:1.75rem;}
.hero-quote cite{display:block;margin-top:0.3rem;font-size:0.58rem;color:var(--muted);font-style:normal;font-family:sans-serif;letter-spacing:1.5px;text-transform:uppercase;}
.hero-stats{display:flex;gap:2rem;flex-wrap:wrap;}
.stat-val{font-family:sans-serif;font-size:1.6rem;font-weight:700;color:var(--gold);display:block;line-height:1;}
.stat-lbl{font-family:sans-serif;font-size:0.55rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:0.2rem;display:block;}

/* LESSON BODY */
.body{padding:2.5rem 3.5rem;max-width:800px;}
.eyebrow{font-family:sans-serif;font-size:0.55rem;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:0.45rem;}
.lesson-h{font-size:1.8rem;font-weight:400;color:var(--white);line-height:1.2;margin-bottom:0.6rem;}
.lesson-lead{font-size:0.88rem;color:var(--muted2);line-height:1.9;margin-bottom:1.5rem;max-width:640px;}
.divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0;}

/* MENTOR BLOCK */
.mentor{background:var(--deep);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 4px 4px 0;padding:1.1rem;margin:1.35rem 0;display:flex;gap:0.8rem;}
.mentor-av{width:36px;height:36px;border-radius:50%;background:var(--gold-dim);border:1px solid rgba(201,168,76,0.25);display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:0.65rem;font-weight:700;color:var(--gold);flex-shrink:0;}
.mentor-lbl{font-family:sans-serif;font-size:0.55rem;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:0.3rem;}
.mentor-txt{font-size:0.82rem;color:var(--cream);line-height:1.85;font-style:italic;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1.25rem;margin-bottom:0.85rem;}
.card-gold{background:var(--gold-glow);border-color:rgba(201,168,76,0.18);}
.card-red{background:rgba(239,68,68,0.03);border-color:rgba(239,68,68,0.18);}
.card-green{background:rgba(34,197,94,0.03);border-color:rgba(34,197,94,0.18);}
.card-blue{background:rgba(96,165,250,0.03);border-color:rgba(96,165,250,0.18);}
.card-teal{background:rgba(45,212,191,0.03);border-color:rgba(45,212,191,0.18);}
.card-purple{background:rgba(167,139,250,0.03);border-color:rgba(167,139,250,0.18);}
.card h3{font-family:sans-serif;font-size:0.72rem;font-weight:600;color:var(--white);margin-bottom:0.4rem;}
.card p,.card li{font-size:0.82rem;color:var(--text);line-height:1.8;}
.card ul,.card ol{padding-left:1.1rem;margin-top:0.35rem;}
.card li{margin-bottom:0.2rem;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1.1rem;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.8rem;margin-bottom:1.1rem;}

/* HIGHLIGHT */
.highlight{background:var(--gold-dim);border:1px solid rgba(201,168,76,0.18);border-radius:4px;padding:1.25rem 1.4rem;margin:1.35rem 0;text-align:center;}
.highlight p{font-size:0.92rem;color:var(--cream);line-height:1.9;font-style:italic;max-width:580px;margin:0 auto;}

/* STEPS */
.steps{margin:1.1rem 0;}
.step{display:flex;gap:1rem;margin-bottom:1.1rem;align-items:flex-start;}
.step-n{width:32px;height:32px;border-radius:50%;background:var(--gold-dim);border:1px solid rgba(201,168,76,0.2);display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:0.68rem;font-weight:700;color:var(--gold);flex-shrink:0;}
.step h4{font-family:sans-serif;font-size:0.78rem;font-weight:600;color:var(--white);margin-bottom:0.2rem;}
.step p{font-size:0.8rem;color:var(--text);line-height:1.8;}

/* COMPARE */
.compare{display:grid;grid-template-columns:1fr 2px 1fr;margin:1.1rem 0;}
.compare-left{background:var(--card);border:1px solid var(--border);padding:1rem;border-radius:4px 0 0 4px;}
.compare-div{background:rgba(201,168,76,0.15);}
.compare-right{background:rgba(45,212,191,0.03);border:1px solid rgba(45,212,191,0.18);padding:1rem;border-radius:0 4px 4px 0;}
.compare-lbl{font-family:sans-serif;font-size:0.55rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:0.3rem;}
.compare-left .compare-lbl{color:var(--gold);}
.compare-right .compare-lbl{color:var(--teal);}
.compare-txt{font-size:0.78rem;color:var(--text);line-height:1.8;}

/* JOURNAL */
.journal{background:rgba(167,139,250,0.03);border:1px solid rgba(167,139,250,0.18);border-radius:4px;padding:1.25rem;margin:1.35rem 0;}
.journal h3{font-family:sans-serif;font-size:0.55rem;color:var(--purple);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:0.6rem;}
.journal-prompt{font-size:0.82rem;color:var(--text);padding-left:0.85rem;border-left:2px solid rgba(167,139,250,0.25);line-height:1.8;margin-bottom:0.6rem;}
textarea{width:100%;margin-top:0.4rem;background:var(--card);border:1px solid var(--border);color:var(--text);padding:0.7rem;font-family:Georgia,serif;font-size:0.8rem;line-height:1.8;border-radius:4px;resize:vertical;min-height:75px;}
textarea:focus{outline:none;border-color:rgba(167,139,250,0.3);}
textarea::placeholder{color:var(--muted);}

/* QUIZ */
.quiz{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1.25rem;margin:1.35rem 0;}
.quiz h3{font-family:sans-serif;font-size:0.55rem;color:var(--blue);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:0.6rem;}
.quiz-q{font-size:0.85rem;color:var(--white);margin-bottom:0.7rem;line-height:1.7;}
.quiz-options{display:flex;flex-direction:column;gap:0.35rem;}
.quiz-opt{width:100%;background:var(--deep);border:1px solid var(--border);padding:0.55rem 0.85rem;border-radius:4px;cursor:pointer;font-size:0.78rem;color:var(--text);text-align:left;font-family:sans-serif;transition:all 0.15s;}
.quiz-opt:hover{border-color:var(--blue);color:var(--white);}
.quiz-opt.correct{border-color:var(--green);background:rgba(34,197,94,0.06);color:var(--green);}
.quiz-opt.wrong{border-color:var(--red);background:rgba(239,68,68,0.06);color:var(--red);}
.quiz-feedback{margin-top:0.7rem;padding:0.7rem 0.85rem;border-radius:4px;font-size:0.78rem;font-family:sans-serif;line-height:1.7;display:none;}
.quiz-feedback.show{display:block;}
.quiz-feedback.correct{background:rgba(34,197,94,0.06);color:var(--green);border:1px solid rgba(34,197,94,0.18);}
.quiz-feedback.wrong{background:rgba(239,68,68,0.06);color:var(--red);border:1px solid rgba(239,68,68,0.18);}

/* CHECKLIST */
.checklist{list-style:none;margin:0.75rem 0;}
.checklist li{display:flex;align-items:flex-start;gap:0.55rem;padding:0.45rem 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.8rem;color:var(--text);cursor:pointer;line-height:1.6;}
.checklist li:last-child{border-bottom:none;}
.chk-box{width:15px;height:15px;border:1px solid var(--border);border-radius:3px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:0.55rem;transition:all 0.15s;}
.checklist li.ticked .chk-box{background:var(--gold);border-color:var(--gold);color:var(--black);}
.checklist li.ticked{color:var(--muted);text-decoration:line-through;}

/* MASTERY */
.mastery{background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.15);border-radius:4px;padding:1.25rem;margin:1.35rem 0;}
.mastery h3{font-family:sans-serif;font-size:0.55rem;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:0.6rem;}

/* DRILL */
.drill{background:rgba(249,115,22,0.04);border:1px solid rgba(249,115,22,0.18);border-radius:4px;padding:1.1rem;margin:1.1rem 0;}
.drill h3{font-family:sans-serif;font-size:0.55rem;color:var(--orange);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:0.5rem;}
.drill p,.drill li{font-size:0.8rem;color:var(--text);line-height:1.8;}
.drill ol{padding-left:1.1rem;margin-top:0.35rem;}

/* CALLOUT */
.callout{display:flex;gap:0.7rem;padding:0.85rem 1rem;border-radius:4px;margin:0.75rem 0;font-size:0.8rem;line-height:1.8;font-family:sans-serif;}
.callout-gold{background:var(--gold-dim);border:1px solid rgba(201,168,76,0.18);color:var(--cream);}
.callout-red{background:rgba(239,68,68,0.05);border:1px solid rgba(239,68,68,0.18);color:#fca5a5;}
.callout-green{background:rgba(34,197,94,0.05);border:1px solid rgba(34,197,94,0.18);color:#86efac;}
.callout-blue{background:rgba(96,165,250,0.05);border:1px solid rgba(96,165,250,0.18);color:#93c5fd;}
.callout-icon{font-size:0.9rem;flex-shrink:0;margin-top:2px;}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;margin:1.1rem 0;font-size:0.78rem;}
.tbl th{background:var(--card2);color:var(--gold);font-family:sans-serif;font-size:0.58rem;letter-spacing:1.5px;text-transform:uppercase;padding:0.58rem 0.85rem;text-align:left;border-bottom:1px solid var(--border);}
.tbl td{padding:0.55rem 0.85rem;color:var(--text);border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:top;line-height:1.7;}
.tbl tr:last-child td{border-bottom:none;}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1rem;}
.tab-btn{padding:0.55rem 0.95rem;font-family:sans-serif;font-size:0.62rem;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all 0.15s;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:-1px;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* LOOP */
.loop{display:flex;margin:1.35rem 0;flex-wrap:wrap;}
.loop-step{flex:1;min-width:110px;background:var(--card);border:1px solid var(--border);padding:0.85rem 0.7rem;text-align:center;position:relative;}
.loop-step::after{content:'›';position:absolute;right:-10px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:1.2rem;z-index:1;}
.loop-step:last-child::after{display:none;}
.loop-num{font-family:sans-serif;font-size:0.52rem;color:var(--gold);letter-spacing:2px;margin-bottom:0.3rem;}
.loop-step h4{font-family:sans-serif;font-size:0.68rem;color:var(--white);margin-bottom:0.2rem;}
.loop-step p{font-size:0.65rem;color:var(--muted2);}
.loop-step.danger{border-color:rgba(239,68,68,0.2);}
.loop-step.danger h4{color:var(--red);}

/* ROUTINE */
.routine{border:1px solid var(--border);border-radius:4px;overflow:hidden;margin:1.35rem 0;}
.routine-hd{background:var(--gold-dim);border-bottom:1px solid rgba(201,168,76,0.12);padding:0.55rem 0.95rem;font-family:sans-serif;font-size:0.58rem;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
.routine-row{display:flex;gap:0.85rem;align-items:flex-start;padding:0.75rem 0.95rem;border-bottom:1px solid var(--border);}
.routine-row:last-child{border-bottom:none;}
.routine-time{font-family:sans-serif;font-size:0.6rem;color:var(--gold);min-width:58px;margin-top:2px;flex-shrink:0;}
.routine-row h4{font-family:sans-serif;font-size:0.72rem;color:var(--white);margin-bottom:0.18rem;}
.routine-row p{font-size:0.73rem;color:var(--muted2);line-height:1.75;}

/* MATH */
.math{background:var(--deep);border:1px solid var(--border);border-radius:4px;padding:1rem 1.25rem;margin:1rem 0;font-family:monospace;font-size:0.82rem;color:var(--cream);line-height:2.1;}
.math span{color:var(--gold);}

/* PILLAR */
.pillar{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1.25rem;transition:border-color 0.2s;}
.pillar:hover{border-color:rgba(201,168,76,0.2);}
.pillar-n{font-family:sans-serif;font-size:1.6rem;font-weight:700;color:rgba(201,168,76,0.1);line-height:1;margin-bottom:0.6rem;}
.pillar h3{font-family:sans-serif;font-size:0.75rem;font-weight:600;color:var(--gold);margin-bottom:0.4rem;}
.pillar p{font-size:0.8rem;color:var(--text);line-height:1.8;}
.pillar-life{margin-top:0.7rem;padding-top:0.7rem;border-top:1px solid var(--border);font-size:0.73rem;color:var(--muted2);font-style:italic;}
.pillar-life strong{color:var(--teal);font-style:normal;}

/* MILESTONE BAR */
.milestones{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin:1.35rem 0;}
.ms{padding:0.85rem 0.5rem;border-right:1px solid var(--border);text-align:center;}
.ms:last-child{border-right:none;}
.ms-day{font-family:sans-serif;font-size:0.5rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:0.35rem;}
.ms-name{font-family:sans-serif;font-size:0.72rem;font-weight:600;color:var(--white);margin-bottom:0.25rem;}
.ms-range{font-family:sans-serif;font-size:0.58rem;color:var(--gold);}
.ms.now{background:var(--gold-dim);}
.ms.now .ms-name{color:var(--gold);}

/* COURSE CARDS */
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin:1.35rem 0;}
.course-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1.2rem;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;text-align:left;width:100%;}
.course-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--border);transition:background 0.2s;}
.course-card:hover::before{background:var(--gold);}
.course-card:hover{border-color:rgba(201,168,76,0.18);}
.cc-tag{font-family:sans-serif;font-size:0.52rem;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:0.45rem;}
.cc-name{font-family:sans-serif;font-size:0.82rem;color:var(--white);margin-bottom:0.3rem;font-weight:500;}
.cc-desc{font-size:0.73rem;color:var(--muted2);line-height:1.65;}
.cc-meta{margin-top:0.7rem;display:flex;gap:0.6rem;font-family:sans-serif;font-size:0.58rem;color:var(--muted);}

/* NAV BUTTONS */
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2.25rem;padding-top:1.5rem;border-top:1px solid var(--border);}
.btn{display:inline-flex;align-items:center;gap:0.35rem;padding:0.55rem 1.1rem;font-family:sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:3px;border:none;transition:all 0.15s;}
.btn-gold{background:var(--gold);color:var(--black);}
.btn-gold:hover{background:var(--gold-l);}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-outline:hover{color:var(--text2);border-color:var(--border2);}
.btn-complete{background:transparent;color:var(--green);border:1px solid rgba(34,197,94,0.25);}
.btn-complete:hover{background:rgba(34,197,94,0.05);}

/* CHATBOT */
#nc-btn{position:fixed;bottom:24px;right:24px;z-index:9000;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(201,168,76,0.4);font-size:1.3rem;transition:all 0.2s;}
#nc-btn:hover{transform:scale(1.08);}
#nc-badge{position:absolute;top:-2px;right:-2px;width:16px;height:16px;background:var(--red);border-radius:50%;border:2px solid var(--black);font-family:sans-serif;font-size:0.5rem;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;}
#nc-window{position:fixed;bottom:90px;right:24px;z-index:8999;width:370px;height:560px;background:var(--deep);border:1px solid var(--border);border-radius:12px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.7);}
#nc-header{padding:0.9rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.7rem;background:#111;flex-shrink:0;}
#nc-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:0.65rem;font-weight:800;color:#000;flex-shrink:0;}
#nc-name{font-family:sans-serif;font-size:0.78rem;font-weight:700;color:var(--white);}
#nc-status{font-family:sans-serif;font-size:0.58rem;color:var(--green);display:flex;align-items:center;gap:0.3rem;}
#nc-status::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;}
#nc-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0.2rem;margin-left:auto;transition:color 0.15s;}
#nc-close:hover{color:var(--white);}
#nc-messages{flex:1;overflow-y:auto;padding:0.85rem;display:flex;flex-direction:column;gap:0.75rem;}
#nc-messages::-webkit-scrollbar{width:2px;}
#nc-messages::-webkit-scrollbar-thumb{background:var(--border);}
.nc-msg{display:flex;gap:0.45rem;align-items:flex-start;}
.nc-msg.user{flex-direction:row-reverse;}
.nc-bubble{max-width:84%;padding:0.6rem 0.85rem;border-radius:10px;font-family:sans-serif;font-size:0.75rem;line-height:1.75;color:var(--text2);}
.nc-bot .nc-bubble{background:var(--card);border:1px solid var(--border);border-radius:4px 10px 10px 10px;}
.nc-user .nc-bubble{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.25);border-radius:10px 4px 10px 10px;color:var(--cream);}
.nc-mini-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:0.5rem;font-weight:800;color:#000;flex-shrink:0;margin-top:2px;}
.nc-time{font-family:sans-serif;font-size:0.5rem;color:var(--muted);margin-top:0.2rem;text-align:center;width:100%;}
#nc-typing-row{display:none;align-items:center;gap:0.45rem;padding:0 0.85rem;}
#nc-typing-row.show{display:flex;}
.nc-typing-bubble{background:var(--card);border:1px solid var(--border);border-radius:4px 10px 10px 10px;padding:0.6rem 0.85rem;display:flex;gap:4px;align-items:center;}
.nc-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:nc-bounce 1.2s infinite;}
.nc-dot:nth-child(2){animation-delay:0.2s;}
.nc-dot:nth-child(3){animation-delay:0.4s;}
@keyframes nc-bounce{0%,100%{opacity:0.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-3px);}}
#nc-chips{padding:0.5rem 0.75rem;border-top:1px solid var(--border);display:flex;gap:0.35rem;flex-wrap:wrap;background:var(--black);flex-shrink:0;}
.nc-chip{background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:sans-serif;font-size:0.58rem;padding:0.25rem 0.6rem;border-radius:20px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.nc-chip:hover{border-color:rgba(201,168,76,0.4);color:var(--gold);}
#nc-input-row{padding:0.65rem 0.75rem;border-top:1px solid var(--border);display:flex;gap:0.45rem;background:#111;flex-shrink:0;}
#nc-input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text2);padding:0.5rem 0.75rem;font-family:sans-serif;font-size:0.75rem;border-radius:6px;outline:none;transition:border-color 0.15s;resize:none;min-height:36px;max-height:80px;line-height:1.5;}
#nc-input:focus{border-color:rgba(201,168,76,0.35);}
#nc-input::placeholder{color:var(--muted);}
#nc-send{width:36px;height:36px;border-radius:6px;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#000;font-size:0.9rem;flex-shrink:0;transition:all 0.15s;}
#nc-send:hover{background:var(--gold-l);}
#nc-send:disabled{opacity:0.4;cursor:not-allowed;}
.nc-footer{font-family:sans-serif;font-size:0.52rem;color:var(--muted);padding:0.3rem;text-align:center;background:var(--black);flex-shrink:0;}
/* Chart SVG in bot message */
.nc-chart-wrap{margin-top:0.6rem;background:#111111;border:1px solid var(--border);border-radius:8px;overflow:hidden;max-width:100%;box-shadow:0 2px 12px rgba(0,0,0,0.4);}
.nc-chart-wrap svg{display:block;width:100%;height:auto;font-family:sans-serif;}


/* LESSON VISUAL DIAGRAMS */
.visual{margin:1.35rem 0;background:#0e0e0e;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.visual-label{font-family:sans-serif;font-size:0.52rem;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;padding:0.5rem 0.85rem;border-bottom:1px solid var(--border);background:#111;}
.visual svg{display:block;width:100%;height:auto;font-family:sans-serif;}

@media(max-width:800px){
  #sidebar{display:none;}
  #main{margin-left:0;}
  .body{padding:1.25rem 1rem;}
  .hero{padding:1.75rem 1rem;}
  .hero h1{font-size:1.6rem;}
  .g2,.g3{grid-template-columns:1fr;}
  .course-grid{grid-template-columns:1fr;}
  .milestones{grid-template-columns:repeat(3,1fr);}
  .compare{grid-template-columns:1fr;gap:0.5rem;}
  .compare-div{display:none;}
  .compare-left{border-radius:4px;}
  .compare-right{border-radius:4px;}
  .loop{flex-direction:column;}
  .loop-step::after{content:'↓';right:50%;bottom:-14px;top:auto;transform:translateX(50%);}
  #nc-window{width:100vw;right:0;bottom:0;border-radius:12px 12px 0 0;height:75vh;max-height:600px;}
  #nc-btn{bottom:16px;right:16px;}
  .lesson-nav{flex-direction:column;gap:0.75rem;align-items:stretch;}
  .lesson-nav button,.lesson-nav div{width:100%;}
  .lesson-nav>div{display:flex;gap:0.5rem;}
  .tbl{font-size:0.7rem;}
  .tbl th,.tbl td{padding:0.4rem 0.5rem;}
  .hero-stats{gap:1.25rem;}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tab-btn{white-space:nowrap;}
}
/* iPhone safe area */
@supports(padding:max(0px)){
  #nc-window{padding-bottom:env(safe-area-inset-bottom);}
  #nc-btn{bottom:max(16px,calc(env(safe-area-inset-bottom) + 12px));}
}
/* Touch targets — min 44px for iOS */
.btn,.quiz-opt,.sb-lesson-btn,.sb-section-btn,.nc-chip{min-height:44px;}
.nc-chip{min-height:32px;}
button{-webkit-tap-highlight-color:transparent;}
/* Prevent iOS zoom on input focus */
#nc-input,textarea,input{font-size:16px;}
</style>

  // ── CONTENT LIBRARY ──────────────────────────────────────
  function getContent(id) {

    return C[id] || defaultContent(id);

  function defaultContent(id) {
    return '<div class="body"><div class="eyebrow">Coming Soon</div><h2 class="lesson-h">This lesson is being built</h2><p class="lesson-lead">Check back soon. Every lesson in this course is being built to the highest standard.</p><div class="lesson-nav"><button class="btn btn-outline" onclick="BTT.go(BTT.prevLesson())">← Previous</button><button class="btn btn-gold" onclick="BTT.go(BTT.nextLesson())">Next →</button></div></div>';
  }

  // ── NAVIGATION ────────────────────────────────────────────
  function go(id) {
    // Hide all views
    var container = document.getElementById('views-container');
    var views = container.children;
    for (var i = 0; i < views.length; i++) {
      views[i].style.display = 'none';
    }

    // Find or create view
    var view = document.getElementById('v-' + id);
    if (!view) {
      view = document.createElement('div');
      view.id = 'v-' + id;
      view.className = 'view';
      view.innerHTML = getContent(id);
      // Init tabs in newly injected content
      var tabGroups = view.querySelectorAll('[class*="tabs"]');
      for (var ti = 0; ti < tabGroups.length; ti++) {
        var panels = tabGroups[ti].querySelectorAll ? null : null;
      }
      // Show first tab panel in each group
      var allPanels = view.querySelectorAll('.tab-panel');
      var seen = {};
      for (var pi = 0; pi < allPanels.length; pi++) {
        var panel = allPanels[pi];
        var parent = panel.parentElement;
        var pid = parent ? parent.id : null;
        if (pid && !seen[pid]) {
          seen[pid] = true;
          panel.style.display = 'block';
          panel.classList.add('active');
          var firstBtn = parent.querySelector('.tab-btn');
          if (firstBtn) firstBtn.classList.add('active');
        } else {
          panel.style.display = 'none';
        }
      }
      container.appendChild(view);
    }
    view.style.display = 'block';
    currentId = id;

    // Update sidebar
    var allBtns = document.querySelectorAll('.sb-lesson-btn');
    for (var j = 0; j < allBtns.length; j++) {
      allBtns[j].classList.remove('active');
    }
    var activeBtn = document.getElementById('sb-' + id);
    if (activeBtn) {
      activeBtn.classList.add('active');
      activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Update nav title
    var title = getLessonTitle(id);
    document.getElementById('nav-title').textContent = title;

    // Scroll to top
    window.scrollTo(0, 0);
    document.getElementById('main').scrollTop = 0;

    // Open correct sidebar section
    openSectionForLesson(id);

    updateProgress();
  }

  function getLessonTitle(id) {
    for (var s = 0; s < SECTIONS.length; s++) {
      for (var l = 0; l < SECTIONS[s].lessons.length; l++) {
        if (SECTIONS[s].lessons[l].id === id) {
          return 'Course ' + SECTIONS[s].num + ' · ' + SECTIONS[s].lessons[l].title;
        }
      }
    }
    return 'Built To Trade';
  }

  function getAllLessons() {
    var all = [];
    for (var s = 0; s < SECTIONS.length; s++) {
      for (var l = 0; l < SECTIONS[s].lessons.length; l++) {
        all.push(SECTIONS[s].lessons[l].id);
      }
    }
    return all;
  }

  function nextLesson() {
    var all = getAllLessons();
    var idx = all.indexOf(currentId);
    return (idx < all.length - 1) ? all[idx + 1] : currentId;
  }

  function prevLesson() {
    var all = getAllLessons();
    var idx = all.indexOf(currentId);
    return (idx > 0) ? all[idx - 1] : currentId;
  }

  function markDone(id, nextId) {
    completed[id] = true;
    var btn = document.getElementById('sb-' + id);
    if (btn) { btn.classList.remove('active'); btn.classList.add('complete'); }
    updateProgress();
    if (nextId) { go(nextId); }
  }

  function updateProgress() {
    var all = getAllLessons();
    var total = all.length - 1;
    var done = 0;
    for (var k in completed) { if (completed[k]) done++; }
    var pct = Math.round((done / total) * 100);
    document.getElementById('nav-pct').textContent = pct + '% complete';
    document.getElementById('nav-pfill').style.width = pct + '%';
  }

  // ── SIDEBAR BUILDER ───────────────────────────────────────
  function buildSidebar() {
    var nav = document.getElementById('sidebar-nav');
    var html = '';
    for (var s = 0; s < SECTIONS.length; s++) {
      var sec = SECTIONS[s];
      html += '<div class="sb-section">';
      html += '<button class="sb-section-btn" onclick="BTT.toggleSection(\'' + sec.id + '\')">';
      html += '<span class="sb-num" id="sbn-' + sec.id + '">' + sec.num + '</span>';
      html += '<span class="sb-section-title" id="sbt-' + sec.id + '">' + sec.title + '</span>';
      html += '<span class="sb-arrow" id="sba-' + sec.id + '">&#9658;</span>';
      html += '</button>';
      html += '<div class="sb-lesson-list" id="sbl-' + sec.id + '">';
      for (var l = 0; l < sec.lessons.length; l++) {
        var lesson = sec.lessons[l];
        html += '<button class="sb-lesson-btn" id="sb-' + lesson.id + '" onclick="BTT.go(\'' + lesson.id + '\')">';
        html += '<span class="sb-dot"></span>' + lesson.title;
        html += '</button>';
      }
      html += '</div></div>';
    }
    nav.innerHTML = html;

    // Open first section by default
    toggleSection('home', true);
  }

  function toggleSection(secId, forceOpen) {
    var list = document.getElementById('sbl-' + secId);
    var arrow = document.getElementById('sba-' + secId);
    if (!list) return;
    var isOpen = list.classList.contains('open');
    if (forceOpen || !isOpen) {
      list.classList.add('open');
      list.style.display = 'block';
      if (arrow) arrow.classList.add('open');
    } else {
      list.classList.remove('open');
      list.style.display = 'none';
      if (arrow) arrow.classList.remove('open');
    }
  }

  function openSectionForLesson(lessonId) {
    for (var s = 0; s < SECTIONS.length; s++) {
      for (var l = 0; l < SECTIONS[s].lessons.length; l++) {
        if (SECTIONS[s].lessons[l].id === lessonId) {
          toggleSection(SECTIONS[s].id, true);
          // Update num badge
          for (var x = 0; x < SECTIONS.length; x++) {
            var numEl = document.getElementById('sbn-' + SECTIONS[x].id);
            var titleEl = document.getElementById('sbt-' + SECTIONS[x].id);
            if (numEl) numEl.classList.remove('active');
            if (titleEl) titleEl.classList.remove('active');
          }
          var activeNum = document.getElementById('sbn-' + SECTIONS[s].id);
          var activeTitle = document.getElementById('sbt-' + SECTIONS[s].id);
          if (activeNum) activeNum.classList.add('active');
          if (activeTitle) activeTitle.classList.add('active');
          return;
        }
      }
    }
  }

  // ── TAB SWITCHER ──────────────────────────────────────────
  function switchTab(groupId, tabId) {
    var group = document.getElementById(groupId);
    if (!group) return;
    // Hide all panels in group
    var panels = group.querySelectorAll('.tab-panel');
    for (var i = 0; i < panels.length; i++) {
      panels[i].style.display = 'none';
      panels[i].classList.remove('active');
    }
    // Deactivate all tab buttons in group
    var btns = group.querySelectorAll('.tab-btn');
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.remove('active');
    }
    // Show target panel
    var panel = document.getElementById(tabId);
    if (panel) { panel.style.display = 'block'; panel.classList.add('active'); }
    // Activate button
    var btn = document.getElementById('tb-' + tabId);
    if (btn) btn.classList.add('active');

  var NC_SYSTEM = 'You are Nate Crest, founder of Built To Trade. Real trader. Real mentor. You talk to students like a person, not a professor.\n\nYOUR VOICE: Short sentences. Simple words. Warm and direct. If a 10 year old could not understand a word, use a simpler one. No walls of text. No fancy language. Get to the point fast and make it stick.\n\nRULES FOR EVERY RESPONSE:\n1. Max 3 short paragraphs. Simple question gets one paragraph. Never write an essay.\n2. One idea per sentence. Never cram two things into one sentence.\n3. Use a real life comparison for every trading concept. Make it click.\n4. End with ONE thing only: a short question to check they got it, one action step, or one rule reminder.\n5. Never use these words: utilize, implement, facilitate, leverage as a verb, whereby, mitigate, inefficiency, subsequent. Use plain words instead.\n6. Never use em dashes. Never give specific buy or sell signals.\n7. NEVER generate SVG code, charts, diagrams, or any code in your responses. If someone asks you to draw or show a chart, tell them to check the relevant lesson in the course where the visual is already built in.\n\nThe Built To Trade curriculum you teach:\n\nCourse 1: The Mental Framework. Trading is 80% mental and 20% strategy. The mindset loop: Trigger, Bad Decision, Compounding Mistake, Exit. The 5 Mental Pillars: Process over outcome, Emotional control, Risk acceptance, Discipline and routine, Patience and detachment. The 5 thinking traps: Judging by your last trade only, Only seeing what you want to see, Getting stuck on one price, Gambler\'s fallacy, Thinking you knew it all along. Revenge trading and tilt recognition. Rebuilding habits through present moment awareness. How trading changes your life.\n\nCourse 2: Market Basics. What markets are, why prices move, buyers vs sellers, supply and demand, liquidity, volatility. Market participants: banks, hedge funds, market makers, algorithms, retail traders. What futures are. The Full Trading System contract: tick size 0.25 points, tick value $0.50, point value $2.00. Major futures markets.\n\nCourse 3: Market Structure. Candlesticks and OHLC. Bullish vs bearish. Trends, ranges, consolidation. Support and resistance. ICT Sessions: Asian 6 PM to midnight NY, London 2 AM to 5 AM NY, New York kill zone 9:30 AM to 12:00 PM ET. AMD: Accumulation during Asian session, Manipulation the Judas Swing, Distribution the real move. Liquidity and stop hunts.\n\nCourse 4: ICT Smart Money Concepts. Key levels: Previous highs and lows, swing points, session opens, equal highs and lows. Order blocks: last candle before a big move, tracks left by big traders. Fair Value Gaps: price zones skipped so fast the market never traded through them. Trading FVGs: mark it, wait for return, enter at 50%, stop beyond gap, target next liquidity. Key levels and FVGs together: strongest setups. The Golden Daily Framework: HTF bias, mark key levels, watch AMD, find FVG and enter.\n\nCourse 5: Your Trading System. Rules: only trade New York session 9:30 AM to 12:00 PM ET, maximum 2 trades per day, 1 to 2 minimum risk reward. Chart setup: neutral colors, ICT Killzones indicator, 4 timeframes: 15 min structure, 5 min confirmation, 3 min refinement, 1 min entry. Pre-session preparation steps. The perfect entry checklist. Trade management: move stop to break even at 1:1, target 1:2 to 1:3.\n\nCourse 6: Risk Management. The 1% rule: never risk more than 1% of account on any single trade. Daily maximum loss: 2 to 3% of account. Weekly loss limit: 5 to 6%. Monthly drawdown: 10% triggers full stop. Risk reward: at 1:2 you only need 34% win rate to be profitable. Drawdown control: reduce size by 50% when in 5% drawdown. Account preservation above all else.\n\nCourse 7: Advanced Trading Psychology. Fear response taking over under financial stress. Loss aversion: losses feel 2.5x more painful than equivalent gains. Dopamine after wins increases risk-taking dangerously. Cortisol under stress impairs decision-making. Getting mentally tired from too many choices, overconfidence, ego, anxiety, burnout, getting in your own way.\n\nCourse 8: Mental Performance. Mindfulness and meditation. Visualization and confidence. Breathing techniques: 4-7-8 for emotional reset. Flow state. Sleep, nutrition and exercise impact. Morning routines. Post-session review.\n\nCourse 9: Journaling. Pre-trade: setup, bias, AMD phase, FVG, key level, entry, stop, target, R:R, emotional state 1-10. Post-trade: rule adherence, execution score, emotion, violations, lesson. End of day review. Weekly and monthly review templates.\n\nCourse 10: Getting Funded. Prop firms: pay a fee, hit profit target without breaking rules, get funded, keep 70-90% of profits. Recommended firms: Alpha Futures code Trading024374, Apex Trader Funding, Topstep, TradeDay, Lucid Trading. Challenge fees: $60 to $400. Where traders wash out: emotional trading and oversized positions.\n\nThe 30-90-365 Day Development Plan. Days 1 to 7: Foundation and course study. Days 8 to 21: Market observation, no trading. Days 22 to 30: Observation only, journal everything. Days 31 to 90: Paper trading, minimum 50 trades documented. Days 91 to 180: Real money at smallest possible size. Days 181 plus: Prop firm evaluation.\n\nCore philosophy: A successful trader is not someone who predicts the market. A successful trader consistently executes a proven process with discipline, emotional control, effective risk management, and continuous improvement.\n\nResponse rules: Keep responses to 3 to 4 short paragraphs maximum unless a detailed explanation is needed. Always address emotions before trading questions when a student is distressed. End every response with either a question, an action step, or a reminder of a core principle. Be honest even when it is hard to hear.';

  function getOfflineReply(q) {
    q = (q || '').toLowerCase();
    if (q.indexOf('fvg') !== -1 || q.indexOf('fair value gap') !== -1)
      return 'A Fair Value Gap is simple. The market moved through a price zone so fast it never actually traded there properly. Think of a store skipping a price on sale — it has to come back and mark it.\n\nTo trade it: find the gap between candle 1 high and candle 3 low. Wait for price to return. Enter at the 50% midpoint. Stop below the gap. Target the next key level.\n\nDoes that make sense or do you want me to walk through it step by step?';
    if (q.indexOf('order block') !== -1 || q.indexOf(' ob ') !== -1 || q.indexOf('ob?') !== -1)
      return 'An order block is the last candle going against the big move — right before price takes off.\n\nIf price made a big move UP, the last red candle before that move is your bullish order block. Institutions left buy orders there. When price comes back to that candle body they buy again and push it higher.\n\nMark that candle body. Wait for price to return. Enter on rejection. Stop just below the zone.\n\nWhat part of finding order blocks are you working on?';
    if (q.indexOf('amd') !== -1 || q.indexOf('accumulation') !== -1 || q.indexOf('manipulation') !== -1 || q.indexOf('judas') !== -1 || q.indexOf('distribution') !== -1)
      return 'AMD is the story the market tells every single day.\n\nAccumulation is the Asian session. Price moves sideways quietly while institutions build positions.\n\nManipulation is the fake move. Price spikes the wrong way to trigger stops. This is the Judas Swing.\n\nDistribution is the real move. After the fake out price drives hard in the true direction.\n\nYour job is to wait for the Judas Swing to complete then get in for the distribution move. When did you last spot this pattern?';
    if (q.indexOf('risk') !== -1 || q.indexOf('1%') !== -1 || q.indexOf('position size') !== -1 || q.indexOf('stop loss') !== -1 || q.indexOf('loss limit') !== -1)
      return 'The 1% rule is non-negotiable. Never risk more than 1% of your account on a single trade.\n\n$10,000 account = $100 max risk per trade. $5,000 account = $50 max risk.\n\nAt 1:2 risk reward you only need to win 34% of your trades to profit. You can lose more than you win and still make money. That math only works if you stick to the 1% rule every time.\n\nAre you sizing your trades correctly right now?';
    if (q.indexOf('revenge') !== -1 || q.indexOf('emotion') !== -1 || q.indexOf('fear') !== -1 || q.indexOf('greed') !== -1 || q.indexOf('tilt') !== -1 || q.indexOf('psychology') !== -1 || q.indexOf('mental') !== -1)
      return 'This is the most important area in trading. Period.\n\nWhen you feel the urge to jump back in after a loss that is your emotional brain running the show. Nothing good comes from trading in that state.\n\nThe fix is simple but hard: close the chart. Walk away. The 4-7-8 breathing technique helps — inhale 4 seconds, hold 7, exhale 8. Do it twice. Your head clears fast.\n\nThe market will be there tomorrow. Your account will not if you keep trading angry. What happened?';
    if (q.indexOf('prop') !== -1 || q.indexOf('funded') !== -1 || q.indexOf('apex') !== -1 || q.indexOf('topstep') !== -1 || q.indexOf('alpha') !== -1 || q.indexOf('challenge') !== -1 || q.indexOf('tradeday') !== -1)
      return 'Prop firms are the path. Pay a small fee, prove you can trade by hitting a profit target without breaking the rules, and they fund you with real capital. You keep 70 to 90% of profits.\n\nFirms I recommend: Alpha Futures use code Trading024374, Apex Trader Funding, Topstep, TradeDay.\n\nThe biggest reason traders fail challenges is not strategy. It is breaking the daily loss limit on one bad day. Stick to your rules and the challenge takes care of itself.\n\nWhich firm are you looking at?';
    if (q.indexOf('session') !== -1 || q.indexOf('kill zone') !== -1 || q.indexOf('new york') !== -1 || q.indexOf('9:30') !== -1 || q.indexOf('london') !== -1 || q.indexOf('asian') !== -1)
      return 'We trade one session only. The New York Kill Zone from 9:30 AM to 12:00 PM ET.\n\nThis is where the highest volume hits and the cleanest AMD setups form. Before 9:30 you prepare. After 12:00 you close the platform and review.\n\nThe Asian session sets the range. London creates the manipulation. New York delivers the real move.\n\nIf you are trading outside this window that is a rule violation. Are you staying in the kill zone?';
    if (q.indexOf('candle') !== -1 || q.indexOf('bullish') !== -1 || q.indexOf('bearish') !== -1 || q.indexOf('wick') !== -1 || q.indexOf('ohlc') !== -1)
      return 'Every candle is a battle between buyers and sellers.\n\nBullish candle: close is above the open. Buyers won that round.\nBearish candle: close is below the open. Sellers won that round.\n\nThe wicks show you where the other side fought back. Long upper wick means sellers rejected price hard up there. Long lower wick means buyers defended that level strong.\n\nRead the wicks. They show you where the real battle happened. What specifically are you trying to understand?';
    if (q.indexOf('support') !== -1 || q.indexOf('resistance') !== -1 || q.indexOf('key level') !== -1 || q.indexOf('level') !== -1)
      return 'Price has memory. That is the whole concept.\n\nWhen price reacted strongly at a level before it will likely react there again. Buyers wait at support. Sellers wait at resistance. Same levels, same reactions.\n\nMark your levels every morning before the session. Previous day high and low. Weekly open. Swing highs and lows. Equal highs and lows.\n\nAre you marking your levels before every session?';
    if (q.indexOf('journal') !== -1 || q.indexOf('review') !== -1 || q.indexOf('log') !== -1)
      return 'Journaling is how experience becomes improvement. Without it you are just repeating the same mistakes.\n\nBefore every trade: write your setup, bias, AMD phase, entry, stop, target, and emotional state 1 to 10.\n\nAfter every trade: did you follow your rules? What went right? What went wrong?\n\n50 documented trades with honest reviews will teach you more than 200 undocumented ones. Are you journaling every trade right now?';
    if (q.indexOf('risk reward') !== -1 || q.indexOf('1:2') !== -1 || q.indexOf('rr') !== -1 || q.indexOf('target') !== -1)
      return 'The minimum we take is 1:2 risk reward. That means for every $100 you risk you are targeting $200.\n\nAt 1:2 you only need to win 34% of your trades to be profitable. Win 40% and you are making good money. The math works in your favor as long as you protect the ratio.\n\nNever take a trade where the target is not at least 2x your risk. If the setup does not offer that walk away. Are you checking risk reward before every entry?';
    if (q.indexOf('start') !== -1 || q.indexOf('beginner') !== -1 || q.indexOf('new to') !== -1 || q.indexOf('how do i') !== -1 || q.indexOf('where do i') !== -1)
      return 'Start with Course 1 on the mental framework before anything else. I mean that seriously. Most people want to skip to the charts but the mind is the foundation everything else sits on.\n\nThen go through the courses in order. Each one builds on the last.\n\nFor the first 30 days just study. Do not trade real money. Watch the market. Journal what you see. Build the knowledge base first.\n\nWhat course are you on right now?';
    if (q.indexOf('break even') !== -1 || q.indexOf('move stop') !== -1 || q.indexOf('trail') !== -1)
      return 'Once your trade hits 1:1 — meaning you are up the same amount you risked — move your stop to your entry price. Now you cannot lose on the trade.\n\nFrom there let it run to your 1:2 or 1:3 target. Worst case you break even. Best case you hit full target.\n\nThis one habit alone protects accounts during drawdowns. Are you moving to break even consistently?';
    if (q.indexOf('mindset') !== -1 || q.indexOf('discipline') !== -1 || q.indexOf('rules') !== -1 || q.indexOf('habit') !== -1)
      return 'Trading is 80% mindset and 20% strategy. I say that not to downplay the technical side but because I have seen great setups destroy accounts when the mind is not right.\n\nThe mindset loop: something triggers you, you make a bad decision, you make another one to cover it, you exit the session damaged.\n\nBreaking that loop starts with awareness. You cannot stop a reaction you cannot see coming. What specific mental challenge are you dealing with right now?';
    if (q.indexOf('chart') !== -1 || q.indexOf('setup') !== -1 || q.indexOf('timeframe') !== -1 || q.indexOf('tradingview') !== -1)
      return 'Our chart setup uses 4 timeframes working together.\n\n15 minute — market structure and overall bias\n5 minute — setup confirmation\n3 minute — entry refinement\n1 minute — precise entry trigger\n\nAlways go top down. Set your bias on the 15 minute first. Then drop down to confirm the setup. Never use the 1 minute for direction — only for timing the entry.\n\nAre you using all four timeframes in your analysis?';
    if (q.indexOf('affiliate') !== -1 || q.indexOf('refer') !== -1 || q.indexOf('earn') !== -1 || q.indexOf('commission') !== -1)
      return 'The Built To Trade affiliate program lets you earn just by sharing what you are already learning.\n\nYou believe in the program, you share it, someone joins, you earn. Simple as that. It is a great way to offset your education costs while you are still developing as a trader.\n\nCheck the platform for your affiliate link and details. Any questions about it?';

    // Default
    return 'Good question. Let me think about the best way to answer that.\n\nWhatever area of trading you are working on right now, the course lessons cover it with visuals and step by step breakdowns. If you are stuck on something specific, describe the exact situation and I will walk you through it.\n\nWhat is the specific thing you are trying to figure out?';

  function chatSend(preset) {
    if (chatBusy) return;
    var input = document.getElementById('nc-input');
    var text = preset || input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = '36px';

    chatAddMsg('user', text);
    chatHistory.push({ role: 'user', content: text });

    chatBusy = true;
    document.getElementById('nc-send').disabled = true;
    chatTyping(true);

    // If opened as a local file, skip the API and use offline replies
    if (window.location.protocol === 'file:') {
      setTimeout(function() {
        chatTyping(false);
        var reply = getOfflineReply(text);
        chatHistory.push({ role: 'assistant', content: reply });
        chatAddMsg('bot', reply);
        chatBusy = false;
        document.getElementById('nc-send').disabled = false;
      }, 600);
      return;
    }

    var apiMsgs = chatHistory.slice();

    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1200,
        system: NC_SYSTEM,
        messages: apiMsgs
      })
    }).then(function(r) {
      if (!r.ok) { return r.json().then(function(e){ throw new Error('API_ERROR:' + r.status); }); }
      return r.json();
    }).then(function(data) {
      chatTyping(false);
      var reply = (data.content && data.content[0] && data.content[0].text)
        ? data.content[0].text
        : 'I ran into a small issue. Try sending your question again.';
      chatHistory.push({ role: 'assistant', content: reply });
      if (chatHistory.length > 20) chatHistory = chatHistory.slice(-16);
      chatAddMsg('bot', reply);
    }).catch(function(err) {
      chatTyping(false);
      // On any connection/CORS/auth error fall back to offline replies
      var reply = getOfflineReply(text);
      chatHistory.push({ role: 'assistant', content: reply });
      chatAddMsg('bot', reply);
    }).finally(function() {
      chatBusy = false;
      document.getElementById('nc-send').disabled = false;
      document.getElementById('nc-input').focus();
    });
  }

<div class="eyebrow">Course 1 · Lesson 6</div>
<h2 class="lesson-h">5 Biases That Kill Trading Accounts</h2>
<p class="lesson-lead">These are not character flaws. They are universal human tendencies that the market exploits without mercy unless you know them by name and have a plan to counter them.</p>
<div class="card card-red"><h3>1. Recency Bias: My Last 3 Trades Won So I Am on Fire</h3><p>You give too much weight to recent results. After 3 wins you become overconfident and increase risk. After 3 losses you abandon a perfectly good strategy. Both reactions destroy long-term performance because your sample size is too small to mean anything statistically.</p><p style="margin-top:0.6rem;color:var(--teal);font-style:italic;font-size:0.78rem;">The Fix: Evaluate your strategy over at least 50 trades. Never change your approach based on fewer than 20 results.</p></div>
<div class="card card-red"><h3>2. Confirmation Bias: I Only See What Confirms My Trade</h3><p>Once you decide you want to take a trade, your brain actively looks for reasons it is good and ignores every reason it is not. You find three bullish signals and dismiss the two bearish ones. You were not analyzing the chart. You were seeking permission.</p><p style="margin-top:0.6rem;color:var(--teal);font-style:italic;font-size:0.78rem;">The Fix: Before every trade, actively look for the strongest reason NOT to take it. If you cannot counter that reason, do not trade.</p></div>
<div class="card card-red"><h3>3. Anchoring Bias: Price Needs to Come Back to Where I Entered</h3><p>You get mentally stuck on your entry price and make decisions around that anchor rather than around what the market is actually doing right now. You hold a loser because it is not back to breakeven yet. The market does not know or care where you entered.</p><p style="margin-top:0.6rem;color:var(--teal);font-style:italic;font-size:0.78rem;">The Fix: Ask yourself this exact question before any decision: If I had no position right now, would I enter this trade? If the answer is no, exit.</p></div>
<div class="card card-red"><h3>4. Gambler's Fallacy: A Win Is Due After 5 Losses</h3><p>Believing that because you have lost five trades in a row, a winner is overdue. Each trade is completely independent. The market has zero memory of your losing streak and owes you nothing. Trading more aggressively to recover is how small drawdowns become account-ending ones.</p><p style="margin-top:0.6rem;color:var(--teal);font-style:italic;font-size:0.78rem;">The Fix: Every trade stands alone. Your edge plays out over hundreds of trades, not on the next specific one.</p></div>
<div class="card card-red"><h3>5. Hindsight Bias: I Knew That Was Going to Happen</h3><p>After a move happens, your brain convinces you that you knew it was coming. This tricks you into believing you are better at predicting the market than you actually are, leading to overconfidence and oversizing on the next trade.</p><p style="margin-top:0.6rem;color:var(--teal);font-style:italic;font-size:0.78rem;">The Fix: Write your full analysis BEFORE the trade. Review it after. The gap between what you predicted and what occurred is your real edge or lack of it.</p></div>

<h2 class="lesson-h">What Is a Market?</h2>
<p class="lesson-lead">Before you can trade anything, you need to understand what a market actually is and why prices move. This is simpler than most courses make it sound.</p>
<div class="card card-gold"><h3>The Simple Definition</h3><p>A market is any place where buyers and sellers meet to exchange something at an agreed price. Your local farmers market works exactly the same way as the New York Stock Exchange. Someone wants to buy. Someone wants to sell. They agree on a price. That price becomes the market price until the next trade happens.</p></div>
<div class="g2">
<div class="card card-green"><h3>Price Goes Up When</h3><p>More people want to buy than there are people willing to sell. Buyers must offer a higher price to attract sellers. This is called a bullish condition. Demand exceeds supply.</p></div>
<div class="card card-red"><h3>Price Goes Down When</h3><p>More people want to sell than there are people willing to buy. Sellers must lower their price to attract buyers. This is called a bearish condition. Supply exceeds demand.</p></div>
</div>

<div class="eyebrow">Key Market Concepts</div>

<tr><td><strong style="color:var(--gold)">Demand</strong></td><td>How much people want to buy at current prices</td><td>High demand pushes prices up over time</td></tr>
<tr><td><strong style="color:var(--gold)">Liquidity</strong></td><td>How easily you can buy or sell without moving the price</td><td>Low liquidity means slippage and harder entries and exits</td></tr>

<tr><td><strong style="color:var(--gold)">Spread</strong></td><td>The difference between the buy price and the sell price</td><td>Every trade costs you at least the spread before you even start</td></tr>

<h2 class="lesson-h">Supply, Demand and Liquidity</h2>
<p class="lesson-lead">Three concepts that explain every price movement ever. Master these and you understand the foundation of why markets do what they do.</p>
<div class="g2">
<div class="card"><h3>Supply Zones</h3><p>Areas where sellers previously overwhelmed buyers and pushed price sharply lower. When price returns to these zones, sellers who missed the first move or who want to add to short positions step in again. Price tends to react at supply zones because unfilled sell orders remain there waiting to trigger.</p></div>

<p class="lesson-lead">These are the mechanical numbers that govern every trade you will ever place. Understand them fully before risking a single dollar.</p>
<div class="g2">
<div class="card"><h3>Margin: What You Actually Deposit</h3><p>Margin is the deposit your broker requires to hold a futures position open. You do not pay the full value of what you are controlling. You pay a small deposit that represents your good-faith commitment. For most micro futures contracts this deposit ranges from $40 to $500 per contract depending on your broker and the time of day.</p></div>
<div class="card"><h3>Leverage: Why the Numbers Matter</h3><p>Leverage means you control a position worth far more than the margin you deposited. One Full Trading System contract controls a notional value of approximately $38,000 or more depending on current price. You control that with a margin of $40 to $500. This magnifies both gains and losses equally. A 10-point move is $20 regardless of your margin deposit.</p></div>
<div class="card"><h3>Initial vs Maintenance Margin</h3><p>Initial margin is the deposit required to open a position. Maintenance margin is the minimum balance required while the position is open. If your account drops below maintenance margin you receive a margin call requiring you to either add funds or close the position. Never trade so close to margin levels that a normal adverse move triggers a forced liquidation.</p></div>
<div class="card card-red"><h3>The Danger of Leverage</h3><p>Leverage amplifies losses exactly as much as it amplifies gains. A 50-point adverse move costs $100 per contract. With 10 contracts that is $1,000 on a single trade. This is why position sizing and risk management are not optional extras. They are the difference between a career and a blown account.</p></div>
</div>
<div class="callout callout-red"><span class="callout-icon">⚠</span><span>Leverage is not free money. Never think of it that way. Think of it as a tool that magnifies the consequences of every decision you make, good and bad. Respect it completely.</span></div>
<div class="math"><span>The Real Cost of Leverage:</span><br>
Contract notional value: approximately <span>$38,000</span><br>
Your margin deposit: <span>$200</span><br>
Leverage ratio: approximately <span>190:1</span><br><br>

<span>This is why the 1% risk rule in Course 6 is non-negotiable.</span></div>

<div class="card"><h3>Range</h3><p>Price contained between horizontal support and resistance. Buy at support with stop below. Sell at resistance with stop above. Exit before the opposite level. Ranges end in breakouts that often become strong trends.</p></div>
</div>
<div class="card card-gold"><h3>Consolidation: The Setup for the Next Move</h3><p>Consolidation is when price compresses into a tight range after a strong move. This is the market pausing to decide its next direction. Consolidations resolve into breakouts. The direction of the breakout is often in the direction of the prior trend. The longer and tighter the consolidation, the more powerful the eventual breakout tends to be.</p></div>
<hr class="divider">
<div class="eyebrow">The The Market Is Like an Auction</div>
<div class="card"><h3>Why Markets Are Actually Auctions</h3><p>Every market is an ongoing auction. Price moves up until there are no more buyers willing to pay higher. Then it moves down to find buyers again. Price moves down until there are no more sellers willing to sell lower. Then it moves up to find sellers again. This constant search for value and fair price is what creates all market structure. Understanding this eliminates the mystery from price movement completely.</p></div>
<div class="steps">
<div class="step"><div class="step-n">1</div><div><h4>Price accepts a level</h4><p>When price stays at a level for an extended time with two-sided trading, that is the accepted value area. Both buyers and sellers agree this is fair value right now.</p></div></div>
<div class="step"><div class="step-n">2</div><div><h4>Price rejects a level</h4><p>When price moves away from a level quickly with very little time spent there, that level was rejected as unfair value. This creates wicks, gaps, and imbalances that price often returns to fill.</p></div></div>
<div class="step"><div class="step-n">3</div><div><h4>Price discovers new value</h4><p>After rejecting a level price moves to discover whether higher or lower prices attract more participation. This is trend movement. The trend continues until new value is found and accepted again.</p></div></div>
</div>

<div class="card"><h3>Support</h3><p>A price level where buying was strong enough to stop a drop and push price back up. When price returns, buyers step in again. Support becomes resistance once broken.</p></div>
<div class="card"><h3>Resistance</h3><p>A price level where selling was strong enough to stop a rally and push price back down. When price returns, sellers step in again. Resistance becomes support once broken.</p></div>
<div class="card"><h3>Role Reversal</h3><p>One of the most powerful patterns in trading. Previous resistance becomes new support after a breakout. Previous support becomes new resistance after a breakdown. These are some of the cleanest entries available.</p></div>
<div class="card"><h3>Strength of a Level</h3><p>The more times price bounced off a level, the stronger it is. But repeated tests also weaken it over time because each test absorbs more of the resting orders there.</p></div>

<div class="card card-gold"><h3>What Liquidity Actually Is</h3><p>Liquidity in trading means clusters of resting orders sitting at predictable price levels. Specifically, stop-loss orders that retail traders place at obvious locations. Above recent highs. Below recent lows. At round numbers. At previous swing points. Institutions need these pools of orders to fill their own massive positions efficiently. So they deliberately engineer price to reach those levels, trigger the stops, collect the liquidity, then reverse.</p></div>
<div class="g3">
<div class="card card-red"><h3>Buy-Side Liquidity</h3><p>Clusters of buy stop orders sitting ABOVE equal highs, previous highs, and trendline highs. These hurt short sellers whose stop losses are placed above resistance. A sweep above these levels then a reversal back below is a buy-side liquidity grab. Classic manipulation before a bearish distribution phase.</p></div>
<div class="card card-red"><h3>Sell-Side Liquidity</h3><p>Clusters of sell stop orders sitting BELOW equal lows, previous lows, and trendline lows. These hurt long traders whose stop losses are placed below support. A sweep below these levels then a reversal back above is a sell-side liquidity grab. Classic manipulation before a bullish distribution phase.</p></div>
<div class="card card-gold"><h3>How to Identify the Grab</h3><p>A wick that PIERCES a key level then CLOSES BACK INSIDE the level is a completed liquidity grab, not a genuine breakout. This is the most important distinction in all of ICT analysis. A genuine breakout closes OUTSIDE the level and holds there. A liquidity grab closes back inside. The close tells the complete story.</p></div>
</div>
<div class="card"><h3>Equal Highs and Lows: The Magnets</h3><p>When price tests the same level twice without breaking through, creating two equal highs or two equal lows, this is a powerful liquidity magnet. Double tops and double bottoms draw smart money because both tests create stop-loss clusters at the same level. Smart money will target these levels with precision to collect the liquidity sitting above the equal highs or below the equal lows before reversing.</p></div>
<div class="drill"><h3>Drill: Hunt the Liquidity Before the Market Does</h3>
<ol><li>Every morning mark all equal highs and equal lows on the 15-minute chart</li><li>Mark the previous day high and low as primary liquidity targets</li><li>Mark the Asian session high and low as secondary targets</li><li>During the session, watch which liquidity pools price moves toward first</li><li>When a pool gets swept with a wick that closes back inside, that is your signal to watch for a reversal entry</li><li>Journal every liquidity grab you identify for 30 days. Your pattern recognition will become extraordinary.</li></ol></div>

<h2 class="lesson-h">Key Levels: Price Has Memory</h2>
<p class="lesson-lead">Before order blocks, before fair value gaps, before any entry trigger, you need to know WHERE price is going. Key levels are the answer. They are the destinations price is always moving toward.</p>
<div class="card card-gold"><h3>Why Key Levels Work</h3><p>When price makes a sharp aggressive move away from a zone, it leaves behind unfilled orders. Traders who wanted to buy or sell at that level but missed the move still have their orders resting there. When price returns to that zone, those orders trigger and create the same type of reaction as before. The market has memory because order books have memory.</p></div>
<div class="g2">
<div class="card"><h3>Previous Day High and Low</h3><p>The most powerful intraday key levels. Every session, the previous day high and low become primary targets for smart money. Stop losses from traders positioned the wrong way cluster just beyond these levels. Marking PDH and PDL before every session is non-negotiable.</p></div>
<div class="card"><h3>Swing Highs and Lows</h3><p>Any point where price peaked and reversed or bottomed and reversed. Swing highs are potential resistance and sell targets. Swing lows are potential support and buy targets. A break of a significant swing level signals a potential shift in market direction.</p></div>
<div class="card"><h3>Session Opens</h3><p>Daily open, weekly open, and monthly open are powerful directional tools. Price above the weekly open signals bullish bias. Price below weekly open signals bearish bias. These levels do not change during the session and institutional algorithms reference them constantly.</p></div>
<div class="card"><h3>Equal Highs and Equal Lows</h3><p>Double tops and double bottoms are liquidity magnets. Two equal highs signal resting buy stops above. Two equal lows signal resting sell stops below. Smart money will target these pools precisely before reversing. EQH and EQL are among the most reliable targets in the entire ICT framework.</p></div>
</div>
<div class="drill"><h3>Drill: Build Your Level Map Every Morning</h3>

<div class="eyebrow">Course 6 · Lesson 5</div>
<h2 class="lesson-h">Expected Value and Positive Expectancy</h2>
<p class="lesson-lead">The average result over many trades is the mathematical foundation that tells you whether your trading system makes money over time. Every professional trader understands this concept completely.</p>
<div class="card card-gold"><h3>What Is Expected Value?</h3><p>The average result over many trades is the average amount you expect to make or lose per trade over a large number of trades. A positive the average result over many trades means your system makes money over time even if individual trades lose. A negative the average result over many trades means your system loses money over time even if individual trades win. The average result over many trades is calculated from your win rate and your average risk-reward ratio together.</p></div>
<div class="math"><span>Expected Value Formula:</span><br><br>
EV = (Win Rate x Average Win) - (Loss Rate x Average Loss)<br><br>
<span>Example with our system:</span><br>
Win Rate: 45%<br>
Average Win: $200 (1:2 on $100 risk)<br>
Loss Rate: 55%<br>
Average Loss: $100<br><br>
EV = (0.45 x $200) - (0.55 x $100)<br>
EV = $90 - $55<br>
EV = <span>+$35 per trade</span><br><br>
<span>Over 100 trades: Expected profit = $3,500</span><br>
<span>This is a a system that wins money over time system. This is what you are building.</span></div>
<div class="g2">
<div class="card card-green"><h3>Positive Expectancy</h3><p>Your system makes money over time when run consistently. Each trade is a sample from a profitable distribution. The goal is not to win every trade. The goal is to execute consistently so the a system that wins money over time manifests across enough trades to show in your results.</p></div>
<div class="card card-red"><h3>Negative Expectancy</h3><p>Your system loses money over time regardless of individual results. Many traders with negative expectancy systems think they are profitable because of a short-term lucky streak. Only a large sample of 50 to 100 or more trades reveals true expectancy. This is why backtesting and paper trading matter.</p></div>
</div>
<div class="callout callout-gold"><span class="callout-icon">★</span><span>You do not need to win every trade. You need a a system that wins money over time system and the discipline to execute it consistently over a large sample. Every deviation from your rules corrupts the expectancy calculation and moves you closer to random results.</span></div>

<h2 class="lesson-h">Drawdown Control</h2>
<p class="lesson-lead">Every trader experiences drawdown. Every single one without exception. The traders who build careers are the ones who know exactly how to manage it when it arrives.</p>
<div class="card card-gold"><h3>What Is Drawdown?</h3><p>Drawdown is the reduction in your account balance from its peak to its current level. If your account reached $12,000 and is now at $10,200 you are in a 15% drawdown. All professional traders track this number continuously. It is one of the most important metrics in all of trading performance management.</p></div>
<div class="steps">
<div class="step"><div class="step-n">1</div><div><h4>Recognize It Early</h4><p>Track your peak account balance daily. Calculate your current drawdown percentage every morning. Knowing you are in a 5% drawdown is very different from discovering you are in a 25% drawdown. Early recognition allows early action.</p></div></div>
<div class="step"><div class="step-n">2</div><div><h4>Reduce Size Immediately at 5%</h4><p>When your account enters a 5% drawdown from its peak, cut your position size by 50% immediately. This slows the bleeding dramatically while you identify whether the drawdown is from bad luck or bad execution. You are protecting capital while staying in the game.</p></div></div>
<div class="step"><div class="step-n">3</div><div><h4>Review Every Trade in the Drawdown</h4><p>During or after any drawdown exceeding 5%, review every losing trade. Was the execution correct and the result just unfavorable variance? Or were there rule violations? The answer determines whether you need to wait out the variance or fix a specific problem.</p></div></div>

</div>

<div class="eyebrow">Course 7 · Lesson 1</div>
<h2 class="lesson-h">The Neuroscience of Trading Decisions</h2>
<p class="lesson-lead">Understanding the brain science behind bad trading decisions does not just make you smarter. It changes how you design your rules, your routines, and your environment to work with your brain instead of against it.</p>
<div class="card card-gold"><h3>The Amygdala Hijack in Detail</h3><p>Your amygdala is a small almond-shaped structure deep in your brain that is responsible for processing threats and triggering survival responses. When you sense financial danger, your amygdala fires a distress signal that reaches your muscles and body before your conscious rational mind has even processed what is happening. In that window of time you are operating on pure instinct. Instinct breaks trading rules. Every time.</p></div>
<div class="g2">
<div class="card card-red"><h3>The Cortisol Trap</h3><p>Chronic trading stress floods your system with cortisol, the stress hormone. High cortisol directly impairs the prefrontal cortex, the part of the brain responsible for rational decision-making, working memory, and impulse control. The exact faculties you need to trade well are the first things to shut down under sustained trading stress. This is why taking breaks and managing your mental state is not optional. It is physiologically essential.</p></div>
<div class="card card-red"><h3>The Dopamine Danger</h3><p>Winning trades release dopamine, the reward chemical. Dopamine creates the desire to repeat the behavior that caused the reward. After a big win, your brain pushes you to take more trades. To size up. To take less quality setups. This dopamine-driven overconfidence is responsible for a massive proportion of account destruction that follows profitable periods. Know this is happening and build rules that protect you from it.</p></div>
</div>
<div class="card"><h3>Building a Brain-Compatible Trading Environment</h3><p>Once you understand that your brain is working against you under stress, you can design your environment to compensate. Rules replace decisions. Checklists replace impulses. Mandatory pauses interrupt the fear response taking over cycle. Journaling activates the prefrontal cortex before entries. None of these practices are just good ideas. They are neurologically sound interventions that override your survival brain with your rational brain at exactly the right moments.</p></div>

<h2 class="lesson-h">Ego, Anxiety and Burnout</h2>
<p class="lesson-lead">Three psychological forces that end trading careers at every level of experience. Recognizing them is the first step to managing them.</p>
<div class="card card-red"><h3>Ego: The Silent Account Killer</h3><p>Ego in trading manifests as the inability to take a loss gracefully. The ego trader holds losers too long because cutting them means admitting they were wrong. They argue with the market instead of accepting its verdict. They double down on losing positions to prove the trade will eventually work. They avoid journaling honestly because honest reflection reveals that their decisions were not as good as they believed. The market humbles everyone. The traders who survive and grow are those who welcome that humbling.</p></div>
<div class="card card-red"><h3>Anxiety: When Fear Becomes Chronic</h3><p>Short-term fear is a normal and appropriate response to financial risk. Chronic trading anxiety is something different. It is a persistent state of worry about trading outcomes that impairs sleep, affects relationships outside of trading, and makes every session feel like a threat rather than an opportunity. If you notice trading anxiety following you away from the screen, that is a signal to reduce position size, increase paper trading time, or take a complete break from trading entirely.</p></div>
